# CI — Hub unit/schema tests (plan 7.2).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt certifi

      - name: Build sample artifacts (uses cached raw if present)
        run: |
          set -euo pipefail
          if ! ls data/raw/CDR_*.csv 1>/dev/null 2>&1; then python scripts/fetch_stooq.py; fi
          if ! ls data/raw/fx_nbp_a_*.csv 1>/dev/null 2>&1; then python scripts/fetch_nbp_fx.py; fi
          python scripts/build_parquet.py
          python scripts/build_manifest.py

      - name: HUB-03 tests
        run: python tests/test_hub_h3.py

      - name: Manifest contract smoke
        run: |
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("data/out/manifest.json").read_text(encoding="utf-8"))
          assert m["schema_version"] == 1
          assert isinstance(m["files"], list) and len(m["files"]) >= 1
          for f in m["files"]:
              assert "name" in f and "sha256" in f
              assert len(f["sha256"]) == 64
          print("HUB contract OK")
          PY
