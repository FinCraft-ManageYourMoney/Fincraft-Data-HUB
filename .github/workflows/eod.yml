# Data Hub — daily EOD job (docs/09 §5, plan H4).
name: EOD Data Hub

on:
  schedule:
    # ~22:30 CET (21:30 UTC) — USA close + NBP table A published earlier same day
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt certifi

      - name: Run EOD pipeline
        run: python scripts/run_eod.py

      - name: Publish Release data-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-latest
          name: FinCraft Data Hub (latest)
          body: |
            Automated EOD bundle: manifest.json + Parquet prices/FX.
            Tracker: verify SHA-256 before ingest (docs/09).
          files: |
            data/out/manifest.json
            data/out/*.parquet
          make_latest: true
          overwrite_files: true
          generate_release_notes: false
